[project]
name = "neuron-network"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
